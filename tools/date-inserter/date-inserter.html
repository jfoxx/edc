<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date Inserter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="date-inserter.css">
</head>
<body class="date-inserter-page sl-loading">
  <main class="date-inserter">
    <section class="date-card" aria-labelledby="now-heading">
      <h2 id="now-heading">Current date &amp; time</h2>
      <p class="field-hint">Your local time, in ISO format.</p>
      <time class="date-preview" id="today-date"></time>
      <sl-button id="insert-today-btn" type="button" disabled>Insert Now</sl-button>
    </section>

    <div class="divider" aria-hidden="true">or</div>

    <section class="date-card" aria-labelledby="custom-heading">
      <h2 id="custom-heading">Choose a date &amp; time</h2>
      <div class="input-row">
        <sl-input type="date" id="date-picker" name="date-picker" label="Date" required></sl-input>
        <div class="time-field">
          <label for="time-picker">Time <span>(optional)</span></label>
          <input type="time" id="time-picker" name="time" aria-describedby="time-hint">
        </div>
      </div>
      <p class="field-hint" id="time-hint">Leave time empty to insert only the date.</p>
      <sl-button class="primary outline" id="insert-custom-btn" type="button" disabled>Insert</sl-button>
    </section>

    <p class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script type="module" src="date-inserter.js"></script>
</body>
</html>
